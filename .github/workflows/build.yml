name: Build NeoForge 1.21.1

on:
  push:
    branches: [1.21.1]
  pull_request:
    branches: [1.21.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-disabled: true

      - name: Build
        run: gradle clean build --no-daemon --no-parallel --no-configuration-cache --refresh-dependencies -Dorg.gradle.caching=false -Pneogradle.subsystems.decompiler.enabled=false
