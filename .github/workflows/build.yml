name: Build
on:
  push:
    branches: [neo-1.21.1]
  pull_request:
    branches: [neo-1.21.1]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build --no-daemon
