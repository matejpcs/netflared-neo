name: Build NeoForge

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Minecraft ${{ matrix.version }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
          path: source
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.2.1"
          cache-disabled: true
      - name: Build
        working-directory: source
        run: gradle clean build --no-daemon --no-parallel --no-configuration-cache --refresh-dependencies -Dorg.gradle.caching=false
      - name: Prepare release artifact
        shell: bash
        run: |
          mkdir -p release
          jar=$(find source/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$jar"
          cp "$jar" "release/netflared-neoforge-${{ matrix.version }}.jar"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflared-neoforge-${{ matrix.version }}
          path: release/netflared-neoforge-${{ matrix.version }}.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Flatten release files
        shell: bash
        run: |
          mkdir -p release-files
          find release -type f -name '*.jar' -exec cp {} release-files/ \;
          test "$(find release-files -type f -name '*.jar' | wc -l)" -eq 12
      - name: Create or update combined release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag='neoforge-1.21.x'
          title='Netflared NeoForge 1.21.x'
          notes='## Minecraft / NeoForge branches

          This release is built from the dedicated version branches 1.21 through 1.21.11.
          Each JAR is compiled against its corresponding Minecraft/NeoForge version.
          Sources JARs are intentionally excluded.'

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "${{ github.repository }}" --title "$title" --notes "$notes"
            gh release upload "$tag" --repo "${{ github.repository }}" release-files/*.jar --clobber
          else
            gh release create "$tag" --repo "${{ github.repository }}" --target main --title "$title" --notes "$notes" release-files/*.jar
          fi
