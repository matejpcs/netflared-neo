name: Build & Release all NeoForge versions
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Netflared mod release version
        required: true
        default: "1.3.9"
permissions:
  contents: write

jobs:
  build:
    name: Build NeoForge ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "1.20", build: "1.20.1", group: "1.20", java: "17", legacy: true }
          - { version: "1.20.1", build: "1.20.1", group: "1.20", java: "17", legacy: true }
          - { version: "1.20.2", build: "1.20.2", group: "1.20", java: "17", legacy: false }
          - { version: "1.20.3", build: "1.20.3", group: "1.20", java: "17", legacy: false }
          - { version: "1.20.4", build: "1.20.4", group: "1.20", java: "17", legacy: false }
          - { version: "1.20.5", build: "1.20.5", group: "1.20", java: "21", legacy: false }
          - { version: "1.20.6", build: "1.20.6", group: "1.20", java: "21", legacy: false }
          - { version: "1.21", build: "1.21", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.1", build: "1.21.1", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.2", build: "1.21.2", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.3", build: "1.21.3", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.4", build: "1.21.4", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.5", build: "1.21.5", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.6", build: "1.21.6", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.7", build: "1.21.7", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.8", build: "1.21.8", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.9", build: "1.21.9", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.10", build: "1.21.10", group: "1.21", java: "21", legacy: false }
          - { version: "1.21.11", build: "1.21.11", group: "1.21", java: "21", legacy: false }
          - { version: "26.0", build: "26.0", group: "26", java: "25", legacy: false }
          - { version: "26.1", build: "26.1", group: "26", java: "25", legacy: false }
          - { version: "26.1.1", build: "26.1", group: "26", java: "25", legacy: false }
          - { version: "26.1.2", build: "26.1.2", group: "26", java: "25", legacy: false }
          - { version: "26.2", build: "26.2", group: "26", java: "25", legacy: false }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Resolve dependency
        id: deps
        env:
          BUILD: ${{ matrix.build }}
          LEGACY: ${{ matrix.legacy }}
        run: |
          set -euo pipefail
          if [ "$LEGACY" = "true" ]; then
            echo "neo=47.1.106" >> "$GITHUB_OUTPUT"
            echo "forge=1.20.1-47.1.106" >> "$GITHUB_OUTPUT"
          else
            html="$(curl --fail --silent --show-error "https://maven.neoforged.net/releases/net/neoforged/neoforge/")"
            if [[ "$BUILD" == 1.* ]]; then prefix="${BUILD#1.}."; else prefix="$BUILD."; fi
            neo="$(printf '%s' "$html" | grep -oE 'href="[^"]+/"' | sed 's#.*href="##;s#/"$##' | grep -F "$prefix" | sort -V | tail -n1)"
            test -n "$neo"
            echo "neo=$neo" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          BUILD: ${{ matrix.build }}
          RELEASE: ${{ inputs.release_version || '1.3.9' }}
          NEO: ${{ steps.deps.outputs.neo }}
          FORGE: ${{ steps.deps.outputs.forge }}
          LEGACY: ${{ matrix.legacy }}
        run: |
          set -euo pipefail
          if [ "$LEGACY" = "true" ]; then
            gradle clean build --no-daemon --stacktrace --refresh-dependencies "-Pmod_version=$RELEASE" "-Pminecraft_version=$BUILD" "-Pneo_version=$NEO" "-Pforge_version=$FORGE"
          else
            gradle clean build --no-daemon --stacktrace --refresh-dependencies "-Pmod_version=$RELEASE" "-Pminecraft_version=$BUILD" "-Pneo_version=$NEO"
          fi
          mapfile -d '' jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' -print0)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "netflared-neo-$VERSION.jar"
          test -s "netflared-neo-$VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.group }}-${{ matrix.version }}
          path: netflared-neo-${{ matrix.version }}.jar
          if-no-files-found: error

  verify:
    name: Verify all JARs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: neo-*
          path: jars
          merge-multiple: true
      - name: Check complete set
        run: |
          set -euo pipefail
          expected="1.20 1.20.1 1.20.2 1.20.3 1.20.4 1.20.5 1.20.6 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.0 26.1 26.1.1 26.1.2 26.2"
          count=0
          for v in $expected; do
            test -s "jars/netflared-neo-$v.jar"
            count=$((count + 1))
          done
          actual="$(find jars -maxdepth 1 -type f -name '*.jar' | wc -l)"
          test "$actual" -eq "$count"
          echo "Verified $count/$count version JARs."

  release:
    name: Release NeoForge ${{ matrix.group }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ["1.20", "1.21", "26"]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: neo-${{ matrix.group }}-*
          path: grouped
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version || '1.3.9' }}-neo-${{ matrix.group }}
          name: Netflared ${{ inputs.release_version || '1.3.9' }} — NeoForge ${{ matrix.group }}
          generate_release_notes: false
          files: grouped/*.jar
